    <div class="container pb-5">
        <div class="row g-4">
            
            <div class="col-lg-4">
                <div class="card card-custom p-4">
                    <h4 class="card-title fw-bold mb-3 text-dark border-bottom pb-2">
                        <i class="bi bi-journal-plus text-warning me-2"></i>Form Input Pra Kembara 2026
                    </h4>
                    
                    <form id="workoutForm">
                        <input type="hidden" id="id">
                        
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Nama Anggota</label>
                            <input type="text" class="form-control" id="nama" placeholder="Masukkan nama" required>
                        </div>
                        
                        <div class="row g-2 mb-2">
                            <div class="col-6">
                                <label class="form-label small fw-semibold">Push Up (Jumlah)</label>
                                <input type="number" class="form-control" id="pushup" placeholder="0">
                            </div>
                            <div class="col-6">
                                <label class="form-label small fw-semibold">Sit Up (Jumlah)</label>
                                <input type="number" class="form-control" id="situp" placeholder="0">
                            </div>
                        </div>

                        <div class="row g-2 mb-2">
                            <div class="col-6">
                                <label class="form-label small fw-semibold">Back Up (Jumlah)</label>
                                <input type="number" class="form-control" id="backup" placeholder="0">
                            </div>
                            <div class="col-6">
                                <label class="form-label small fw-semibold">Plank (Detik)</label>
                                <input type="number" class="form-control" id="plank" placeholder="0">
                            </div>
                        </div>

                        <div class="row g-2 mb-2">
                            <div class="col-6">
                                <label class="form-label small fw-semibold">Squat (Jumlah)</label>
                                <input type="number" class="form-control" id="squat" placeholder="0">
                            </div>
                            <div class="col-6">
                                <label class="form-label small fw-semibold">Steps (Detik)</label>
                                <input type="number" class="form-control" id="steps" placeholder="0">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Flexometer (cm)</label>
                            <input type="number" step="0.1" class="form-control" id="flexometer" placeholder="0">
                        </div>

                        <button type="submit" class="btn btn-pks w-100 py-2 shadow-sm" id="btnSimpan">
                            <i class="bi bi-save me-1"></i> Simpan Data
                        </button>
                    </form>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="card card-custom p-4">
                    <h4 class="card-title fw-bold mb-3 text-dark border-bottom pb-2">
                        <i class="bi bi-table text-warning me-2"></i>Data Workout Tersimpan
                    </h4>
                    
                    <div class="table-responsive">
                        <table class="table table-hover table-striped table-bordered align-middle text-center table-pks mb-0">
                            <thead>
                                <tr>
                                    <th>Nama</th>
                                    <th>Push Up</th>
                                    <th>Sit Up</th>
                                    <th>Back Up</th>
                                    <th>Plank (s)</th>
                                    <th>Squat</th>
                                    <th>Steps</th>
                                    <th>Flexometer</th>
                                    <th>Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="dataTable">
                                <tr>
                                    <td colspan="9" class="text-muted">Memuat data...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/bootstrap.bundle.min.js"></script>

    <script>
        // Ganti dengan URL Google Apps Script Web App Anda
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzMCT6dZWuTLqtFHxaXOXIlBH0aZoTofnyF5wPQYFnTRiYAbr_pA3evKIAfsek9P3-L/exec";

        document.getElementById("workoutForm").addEventListener("submit", function(e) {
            e.preventDefault();
            
            const id = document.getElementById("id").value;
            const action = id ? "update" : "create";
            
            const data = {
                action: action,
                id: id,
                nama: document.getElementById("nama").value,
                pushup: document.getElementById("pushup").value,
                situp: document.getElementById("situp").value,
                backup: document.getElementById("backup").value,
                plank: document.getElementById("plank").value,
                squat: document.getElementById("squat").value,
                steps: document.getElementById("steps").value,
                flexometer: document.getElementById("flexometer").value
            };

            const params = new URLSearchParams(data);

            fetch(`${WEB_APP_URL}?${params.toString()}`)
            .then(res => res.json())
            .then(response => {
                alert("Data berhasil disimpan!");
                document.getElementById("workoutForm").reset();
                document.getElementById("id").value = "";
                loadData();
            })
            .catch(err => console.error("Error simpan data:", err));
        });

        function loadData() {
            const callbackName = 'handleDataResponse_' + Math.round(100000 * Math.random());
            
            window[callbackName] = function(data) {
                let rows = "";
                if (!data || data.length === 0) {
                    rows = `<tr><td colspan="9" class="text-muted">Belum ada data tersimpan.</td></tr>`;
                } else {
                    data.forEach(item => {
                        const safeItem = JSON.stringify(item).replace(/'/g, "\\'");
                        rows += `<tr>
                            <td class="fw-semibold text-start">${item.nama || ''}</td>
                            <td>${item.pushup || 0}</td>
                            <td>${item.situp || 0}</td>
                            <td>${item.backup || 0}</td>
                            <td>${item.plank || 0}</td>
                            <td>${item.squat || 0}</td>
                            <td>${item.steps || 0}</td>
                            <td>${item.flexometer || 0} cm</td>
                            <td>
                                <div class="btn-group btn-group-sm">
                                    <button type="button" class="btn btn-outline-warning" onclick='editData(${safeItem})'>
                                        <i class="bi bi-pencil-square"></i>
                                    </button>
                                    <button type="button" class="btn btn-outline-danger" onclick="deleteData('${item.id}')">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>`;
                    });
                }
                
                document.getElementById("dataTable").innerHTML = rows;
                if(document.body.contains(script)) {
                    document.body.removeChild(script);
                }
                delete window[callbackName];
            };

            const script = document.createElement('script');
            script.src = `${WEB_APP_URL}?action=read&callback=${callbackName}`;
            script.onerror = function() {
                document.getElementById("dataTable").innerHTML = `<tr><td colspan="9" class="text-danger">Gagal memuat data dari server.</td></tr>`;
            };
            document.body.appendChild(script);
        }

        function editData(item) {
            document.getElementById("id").value = item.id;
            document.getElementById("nama").value = item.nama;
            document.getElementById("pushup").value = item.pushup;
            document.getElementById("situp").value = item.situp;
            document.getElementById("backup").value = item.backup;
            document.getElementById("plank").value = item.plank;
            document.getElementById("squat").value = item.squat;
            document.getElementById("steps").value = item.steps;
            document.getElementById("flexometer").value = item.flexometer;
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deleteData(id) {
            if(confirm("Apakah Anda yakin ingin menghapus data ini?")) {
                fetch(`${WEB_APP_URL}?action=delete&id=${id}`)
                .then(res => res.json())
                .then(response => {
                    alert("Data berhasil dihapus!");
                    loadData();
                });
            }
        }

        // Muat data saat halaman pertama kali dibuka
        loadData();
    </script>
</body>
</html>
