<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Aplikasi CRUD Fitness Workout</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        form { background: #f4f4f4; padding: 15px; border-radius: 5px; width: 400px; }
        .form-group { margin-bottom: 10px; }
        label { display: inline-block; width: 140px; }
        input { padding: 5px; width: 220px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background-color: #2c3e50; color: white; }
    </style>
</head>
<body>

    <h2>Form Test Kebugaran Pra Kembara</h2>
    
    <form id="workoutForm">
        <input type="hidden" id="id">
        <div class="form-group">
            <label>Nama:</label>
            <input type="text" id="nama" required>
        </div>
        <div class="form-group">
            <label>Push Up (Jumlah):</label>
            <input type="number" id="pushup">
        </div>
        <div class="form-group">
            <label>Sit Up (Jumlah):</label>
            <input type="number" id="situp">
        </div>
        <div class="form-group">
            <label>Back Up (Jumlah):</label>
            <input type="number" id="backup">
        </div>
        <div class="form-group">
            <label>Plank (Detik):</label>
            <input type="number" id="plank">
        </div>
        <div class="form-group">
            <label>Squat (Jumlah):</label>
            <input type="number" id="squat">
        </div>
        <div class="form-group">
            <label>Steps (Detik):</label>
            <input type="number" id="steps">
        </div>
        <div class="form-group">
            <label>Flexometer (cm):</label>
            <input type="number" step="0.1" id="flexometer">
        </div>
        <button type="submit" id="btnSimpan">Simpan Data</button>
    </form>

    <h2>Data Workout Tersimpan</h2>
    <table>
        <thead>
            <tr>
                <th>Nama</th>
                <th>Push Up</th>
                <th>Sit Up</th>
                <th>Back Up</th>
                <th>Plank (s)</th>
                <th>Squat</th>
                <th>Steps</th>
                <th>Flexometer (cm)</th>
                <th>Aksi</th>
            </tr>
        </thead>
        <tbody id="dataTable">
            <!-- Data akan dimuat di sini -->
        </tbody>
    </table>

    <script>
        // Ganti dengan URL Web App Google Apps Script Anda
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzMCT6dZWuTLqtFHxaXOXIlBH0aZoTofnyF5wPQYFnTRiYAbr_pA3evKIAfsek9P3-L/exec";

       document.getElementById("workoutForm").addEventListener("submit", function(e) {
            e.preventDefault();
            
            const id = document.getElementById("id").value;
            const action = id ? "update" : "create";
            
            const data = {
                action: action,
                id: id,
                nama: document.getElementById("nama").value,
                pushup: document.getElementById("pushup").value,
                situp: document.getElementById("situp").value,
                backup: document.getElementById("backup").value,
                plank: document.getElementById("plank").value,
                squat: document.getElementById("squat").value,
                steps: document.getElementById("steps").value,
                flexometer: document.getElementById("flexometer").value
            };
        
            const params = new URLSearchParams(data);
        
            // Mengirim permintaan menggunakan metode GET via Query Parameters
            fetch(`${WEB_APP_URL}?${params.toString()}`)
            .then(res => res.json())
            .then(response => {
                alert("Data berhasil disimpan!");
                document.getElementById("workoutForm").reset();
                document.getElementById("id").value = "";
                loadData();
            })
            .catch(err => console.error("Error:", err));
        });

        function loadData() {
            // Buat nama fungsi callback unik
            const callbackName = 'handleDataResponse_' + Math.round(100000 * Math.random());
            
            // Deklarasikan fungsi callback di window global
            window[callbackName] = function(data) {
                let rows = "";
                data.forEach(item => {
                    const safeItem = JSON.stringify(item).replace(/'/g, "\\'");
                    rows += `<tr>
                        <td>${item.nama || ''}</td>
                        <td>${item.pushup || 0}</td>
                        <td>${item.situp || 0}</td>
                        <td>${item.backup || 0}</td>
                        <td>${item.plank || 0}</td>
                        <td>${item.squat || 0}</td>
                        <td>${item.steps || 0}</td>
                        <td>${item.flexometer || 0}</td>
                        <td>
                            <button type="button" onclick='editData(${safeItem})'>Edit</button>
                            <button type="button" onclick="deleteData('${item.id}')">Hapus</button>
                        </td>
                    </tr>`;
                });
                document.getElementById("dataTable").innerHTML = rows;
                
                // Bersihkan tag script dan fungsi callback setelah selesai
                document.body.removeChild(script);
                delete window[callbackName];
            };
        
            // Sisipkan tag script secara dinamis untuk menembus batasan CORS
            const script = document.createElement('script');
            script.src = `${WEB_APP_URL}?action=read&callback=${callbackName}`;
            script.onerror = function() {
                console.error("Gagal memuat data via JSONP");
            };
            document.body.appendChild(script);
        }

        function editData(item) {
            document.getElementById("id").value = item.id;
            document.getElementById("nama").value = item.nama;
            document.getElementById("pushup").value = item.pushup;
            document.getElementById("situp").value = item.situp;
            document.getElementById("backup").value = item.backup;
            document.getElementById("plank").value = item.plank;
            document.getElementById("squat").value = item.squat;
            document.getElementById("steps").value = item.steps;
            document.getElementById("flexometer").value = item.flexometer;
        }

        function deleteData(id) {
            if(confirm("Yakin ingin menghapus data ini?")) {
                fetch(`${WEB_APP_URL}?action=delete&id=${id}`)
                .then(res => res.json())
                .then(response => {
                    alert("Data berhasil dihapus!");
                    loadData();
                });
            }
        }

        // Muat data saat halaman dibuka
        loadData();
    </script>
</body>
</html>
